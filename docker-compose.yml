# Local Docker: n8n + Qdrant only.
# frontend / backend / ai-service → npm run dev
# vLLM → this PC host process :8001 (not in this file)
# MariaDB → Lightsail (`DB_HOST`)
#
# Bind 127.0.0.1 so 5678/6333/6334 are not on the LAN.
#   docker compose up -d
#   docker compose ps

services:
  qdrant:
    image: qdrant/qdrant
    container_name: kdt-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./DB/data/qdrant_storage:/qdrant/storage

  n8n:
    image: n8nio/n8n:2.34.5
    container_name: kdt-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"
      N8N_HOST: 127.0.0.1
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://127.0.0.1:5678/
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./DB/data/n8n:/home/node/.n8n

